name: Keep Supabase awake

# Supabase pauses a free-tier project after a week with no API activity, and cocktail nights are
# monthly — the project would be asleep every single time without this. Daily, not weekly:
# Supabase's own docs ask for "a few requests each day over the previous week". Andy never sees
# this run; it's free forever on GitHub's schedule.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Die Leer/e database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://ylxizoepyqpulasqqyfc.supabase.co/rest/v1/friends?select=id&limit=1" \
            -H "apikey: sb_publishable_ite9_Hl4DSExGhyPXQys8Q_O0JeLt97")
          echo "Supabase responded: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase didn't respond as expected (HTTP $code) — check the project hasn't been deleted or the key hasn't been rotated."
            exit 1
          fi
