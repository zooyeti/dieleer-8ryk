name: Keep Supabase awake

# Supabase pauses a free-tier project after a week of insufficient API activity, and cocktail
# nights are monthly. One request a day wasn't enough: on 2026-10-08 Supabase warned the project
# was scheduled to pause even though this job had run green daily. So each run now makes a spread
# of real requests — a read and a count on every table, plus the auth health check.
# Fails loudly on ANY non-200, not just 5xx: a 401/403 (e.g. a missing GRANT) used to pass silently.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Make a spread of requests to the Die Leer/e database
        run: |
          base="https://ylxizoepyqpulasqqyfc.supabase.co"
          key="sb_publishable_ite9_Hl4DSExGhyPXQys8Q_O0JeLt97"
          fail=0
          check() {
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$1" -H "apikey: $key" -H "Prefer: count=exact" || echo 000)
            echo "$code  $1"
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then fail=1; fi
          }
          for t in friends ratings nights custom_items; do
            check "$base/rest/v1/$t?select=*&limit=50"
            check "$base/rest/v1/$t?select=id&limit=1"
          done
          check "$base/auth/v1/health"
          if [ "$fail" = "1" ]; then
            echo "::error::At least one Supabase request didn't return 200 — check the project hasn't been paused or deleted, the key hasn't been rotated, and the table GRANTs are still in place."
            exit 1
          fi
