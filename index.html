<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Leer/e</title>
<meta name="description" content="Menus, ratings and the archive for Andy's cocktail nights.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Die Leer/e">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F2E9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1B1A">
<style>
  :root {
    --bg: #F7F2E9;
    --surface: #FFFFFF;
    --surface-2: #EEE6D8;
    --text: #2A2A2E;
    --muted: #756E63;
    --line: #E3D9C6;
    --accent: #7A1F2B;
    --accent-soft: #F1DEE0;
    --on-accent: #F7F2E9;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1B1A;
      --surface: #282422;
      --surface-2: #332E2B;
      --text: #F2EDE5;
      --muted: #B0A79A;
      --line: #3E3833;
      --accent: #D98A96;
      --accent-soft: #3A2429;
      --on-accent: #2A2A2E;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }

  /* ---------- header ---------- */
  .app-header {
    position: relative;
    overflow: hidden;
    min-height: 150px;
    padding-top: calc(env(safe-area-inset-top) + 22px);
    padding-bottom: 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-mark {
    position: absolute;
    top: -6px;
    right: -26px;
    width: 186px;
    color: var(--text);
    opacity: 0.17;
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .header-mark { opacity: 0.24; }
  }
  .header-mark svg { display: block; width: 100%; height: auto; }
  .header-content { position: relative; max-width: 720px; margin: 0 auto; padding: 0 18px; }
  .header-content h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.01em;
    font-weight: 700;
  }
  .header-content h1 .slash { color: var(--accent); }
  .header-content .updated {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* ---------- main / cards ---------- */
  .app-main { padding: 18px 0 28px; }
  .screen-kicker {
    display: block;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
  }
  .screen-title {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
  }
  .screen-note {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 15px;
  }
  .section-heading {
    margin: 26px 0 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .section-heading:first-of-type { margin-top: 0; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .card:active { transform: scale(0.985); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-name { font-size: 16.5px; font-weight: 600; }
  .card-base { color: var(--muted); font-size: 13px; white-space: nowrap; text-transform: capitalize; }
  .card-desc { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12.5px;
    line-height: 1.3;
  }
  .chip.muted { color: var(--muted); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ---------- night list (archive) ---------- */
  .night-row {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
  }
  .night-row:active { transform: scale(0.985); }
  .night-row .kicker { color: var(--accent); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .night-row h3 { margin: 2px 0 2px; font-size: 17px; }
  .night-row p { margin: 0; color: var(--muted); font-size: 14px; }

  /* ---------- drink detail ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14.5px;
    margin-bottom: 16px;
    min-height: 44px;
    align-content: center;
  }
  .detail-name { margin: 0 0 6px; font-size: 26px; font-weight: 700; }
  .detail-desc { margin: 0 0 18px; font-size: 16px; color: var(--text); }
  .detail-section { margin-bottom: 20px; }
  .detail-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  .source-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
  }
  .source-link:active { opacity: 0.8; }
  .char-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .char-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 92px; }
  .char-stat .num { font-size: 20px; font-weight: 700; }
  .char-stat .label { font-size: 12px; color: var(--muted); }

  .phase2-note {
    background: var(--accent-soft);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 4px;
  }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state h2 { color: var(--text); font-size: 19px; margin-bottom: 8px; }

  /* ---------- tab bar ---------- */
  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 10;
  }
  .tab-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 56px;
    text-decoration: none;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .tab-link .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: transparent;
    margin-bottom: 2px;
  }
  .tab-link.active { color: var(--accent); }
  .tab-link.active .dot { background: var(--accent); }

  @supports (backdrop-filter: blur(6px)) {
    .tab-bar { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var TAG_HEADINGS = {
    "starter": "The Starter (and Revision)",
    "the-negroni": "The Negroni",
    "close-variant": "Close Variants",
    "weirder": "Weirder Negroni",
    "wild": "Wild Negronis",
    "dessert": "Dessert"
  };

  var BASE_LABELS = {
    gin: "Gin", vodka: "Vodka", rum: "Rum", tequila: "Tequila",
    whisky: "Whisky", brandy: "Brandy", other: "Other"
  };

  var state = { nights: null, updated: null, error: null };
  var app = document.getElementById("app");
  var updatedLine = document.getElementById("updated-line");

  // ---------- small helpers ----------
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseYMD(s) {
    var parts = String(s).split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function todayLocal() {
    var t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function dayDiff(a, b) {
    return Math.round((a - b) / 86400000);
  }

  function formatDate(dateStr) {
    var d = parseYMD(dateStr);
    var opts = { day: "numeric", month: "short" };
    if (d.getFullYear() !== todayLocal().getFullYear()) opts.year = "numeric";
    try {
      return d.toLocaleDateString(undefined, opts);
    } catch (e) {
      return dateStr;
    }
  }

  // Date-derived label. Never "Tonight" unless the date is actually today.
  function nightKicker(dateStr) {
    var diff = dayDiff(parseYMD(dateStr), todayLocal());
    if (diff === 0) return "Tonight";
    if (diff === -1) return "Last night";
    if (diff === 1) return "Tomorrow";
    if (diff < -1) return formatDate(dateStr);
    return "Upcoming — " + formatDate(dateStr);
  }

  function allNightsSorted() {
    if (!state.nights) return [];
    return state.nights.slice().sort(function (a, b) {
      return parseYMD(b.date) - parseYMD(a.date);
    });
  }

  function findNight(id) {
    if (!state.nights) return null;
    for (var i = 0; i < state.nights.length; i++) {
      if (state.nights[i].id === id) return state.nights[i];
    }
    return null;
  }

  function findCocktail(id) {
    if (!state.nights) return null;
    for (var n = 0; n < state.nights.length; n++) {
      var cocktails = state.nights[n].cocktails || [];
      for (var c = 0; c < cocktails.length; c++) {
        if (cocktails[c].id === id) return { night: state.nights[n], cocktail: cocktails[c] };
      }
    }
    return null;
  }

  // ---------- rendering pieces ----------
  function renderDog(score) {
    // score is 1-5. Full dog clipped from the left to score/5 of its width. No score -> outline chip elsewhere, not this control.
    var frac = Math.max(0, Math.min(5, score)) / 5;
    var clipW = Math.round(2037 * frac);
    var clipId = "clip-" + Math.random().toString(36).slice(2);
    return (
      '<svg viewBox="0 0 2037 1433" width="34" height="24" aria-hidden="true">' +
      '<defs><clipPath id="' + clipId + '"><rect x="0" y="0" width="' + clipW + '" height="1433"></rect></clipPath></defs>' +
      '<g clip-path="url(#' + clipId + ')">' +
      '<use href="#sym-dog" stroke="currentColor" stroke-width="40" stroke-linejoin="round"></use>' +
      "</g></svg>"
    );
  }

  function charChips(c) {
    var hasChar = typeof c.strength === "number" || typeof c.sweetSour === "number";
    if (!hasChar) {
      return '<span class="chip muted">No details yet</span>';
    }
    var out = "";
    if (typeof c.strength === "number") out += '<span class="chip">Strength ' + esc(c.strength) + '/10</span>';
    if (typeof c.sweetSour === "number") out += '<span class="chip">Sweet–sour ' + esc(c.sweetSour) + '/10</span>';
    return out;
  }

  function cocktailCardMeta(c) {
    var out = "";
    if (c.tags && c.tags.length > 1) {
      // first tag drives the section heading; show the rest as chips
      c.tags.slice(1).forEach(function (t) {
        out += '<span class="chip muted">' + esc(t.replace(/-/g, " ")) + "</span>";
      });
    }
    out += charChips(c);
    if (c.source && c.source.url) out += '<span class="chip accent">Recipe ↗</span>';
    return out;
  }

  function cocktailCard(c, nightId) {
    var base = c.base && BASE_LABELS[c.base] ? BASE_LABELS[c.base] : (c.base || "");
    return (
      '<a class="card" href="#/night/' + esc(nightId) + "/drink/" + esc(c.id) + '">' +
      '<div class="card-top"><span class="card-name">' + esc(c.name) + "</span>" +
      (base ? '<span class="card-base">' + esc(base) + "</span>" : "") +
      "</div>" +
      (c.description ? '<p class="card-desc">' + esc(c.description) + "</p>" : "") +
      '<div class="card-meta">' + cocktailCardMeta(c) + "</div>" +
      "</a>"
    );
  }

  function groupByTag(cocktails) {
    var groups = [];
    var current = null;
    cocktails.forEach(function (c) {
      var key = (c.tags && c.tags[0]) || "more";
      if (!current || current.key !== key) {
        current = { key: key, items: [] };
        groups.push(current);
      }
      current.items.push(c);
    });
    return groups;
  }

  function renderNightBody(night) {
    var cocktails = night.cocktails || [];
    if (!cocktails.length) {
      return '<p class="screen-note">No drinks on this menu yet.</p>';
    }
    var groups = groupByTag(cocktails);
    var html = "";
    groups.forEach(function (g) {
      var heading = TAG_HEADINGS[g.key] || (g.key === "more" ? "" : g.key.replace(/-/g, " "));
      if (heading) html += '<h2 class="section-heading">' + esc(heading) + "</h2>";
      html += '<div class="card-list">' + g.items.map(function (c) { return cocktailCard(c, night.id); }).join("") + "</div>";
    });
    return html;
  }

  // ---------- screens ----------
  function screenTonight() {
    var nights = allNightsSorted();
    if (!nights.length) return screenEmptyNights();
    return goToNight(nights[0].id, true);
  }

  function screenNightUnknown() {
    var html =
      '<div class="wrap">' +
      '<div class="empty-state"><h2>That night isn’t in the archive</h2>' +
      '<p>The link might be old. Here’s what’s actually on record.</p></div>' +
      screenNightsListMarkup() +
      "</div>";
    app.innerHTML = html;
    setActiveTab("nights");
  }

  function screenEmptyNights() {
    app.innerHTML =
      '<div class="wrap"><div class="empty-state"><h2>No nights yet</h2>' +
      "<p>Once a menu is published it’ll show up here.</p></div></div>";
    setActiveTab("tonight");
  }

  function goToNight(nightId, isTonightTab) {
    var night = findNight(nightId);
    if (!night) return screenNightUnknown();
    var kicker = nightKicker(night.date);
    app.innerHTML =
      '<div class="wrap">' +
      '<span class="screen-kicker">' + esc(kicker) + "</span>" +
      '<h1 class="screen-title">' + esc(night.title || "Untitled night") + "</h1>" +
      (night.note ? '<p class="screen-note">' + esc(night.note) + "</p>" : "") +
      renderNightBody(night) +
      "</div>";
    setActiveTab(isTonightTab ? "tonight" : "nights");
  }

  function screenNightsListMarkup() {
    var nights = allNightsSorted();
    if (!nights.length) {
      return '<p class="screen-note">Nothing archived yet.</p>';
    }
    return (
      '<div class="card-list">' +
      nights
        .map(function (n) {
          var kicker = nightKicker(n.date);
          var count = (n.cocktails || []).length;
          return (
            '<a class="night-row" href="#/night/' + esc(n.id) + '">' +
            '<span class="kicker">' + esc(kicker) + "</span>" +
            "<h3>" + esc(n.title || "Untitled night") + "</h3>" +
            "<p>" + count + (count === 1 ? " drink" : " drinks") + (n.note ? " · " + esc(n.note) : "") + "</p>" +
            "</a>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function screenNights() {
    app.innerHTML =
      '<div class="wrap">' +
      '<span class="screen-kicker">Archive</span>' +
      '<h1 class="screen-title">Past &amp; upcoming nights</h1>' +
      '<p class="screen-note">Every night ever planned, newest first.</p>' +
      screenNightsListMarkup() +
      "</div>";
    setActiveTab("nights");
  }

  function screenDrink(nightId, drinkId) {
    var night = findNight(nightId);
    var cocktail = night ? (night.cocktails || []).find(function (c) { return c.id === drinkId; }) : null;
    if (!night || !cocktail) {
      // Fall back to the night if we have it, otherwise the archive. Never a blank screen.
      return night ? goToNight(nightId, false) : screenNightUnknown();
    }
    var base = cocktail.base && BASE_LABELS[cocktail.base] ? BASE_LABELS[cocktail.base] : cocktail.base;
    var html =
      '<div class="wrap">' +
      '<a class="back-link" href="#/night/' + esc(nightId) + '">← ' + esc(night.title || "Back") + "</a>" +
      '<h1 class="detail-name">' + esc(cocktail.name) + "</h1>" +
      (cocktail.description ? '<p class="detail-desc">' + esc(cocktail.description) + "</p>" : "") +
      '<div class="card-meta" style="margin-bottom:20px">' +
      (base ? '<span class="chip">' + esc(base) + "</span>" : "") +
      (cocktail.tags || [])
        .map(function (t) { return '<span class="chip muted">' + esc(t.replace(/-/g, " ")) + "</span>"; })
        .join("") +
      "</div>" +
      '<div class="detail-section"><p class="detail-label">Character</p><div class="char-row">' +
      (typeof cocktail.strength === "number"
        ? '<div class="char-stat"><div class="num">' + esc(cocktail.strength) + "/10</div><div class=\"label\">Strength</div></div>"
        : "") +
      (typeof cocktail.sweetSour === "number"
        ? '<div class="char-stat"><div class="num">' + esc(cocktail.sweetSour) + "/10</div><div class=\"label\">Sweet–sour</div></div>"
        : "") +
      (typeof cocktail.strength !== "number" && typeof cocktail.sweetSour !== "number"
        ? '<span class="chip muted">No details yet — not linked to Difford’s</span>'
        : "") +
      "</div></div>" +
      (cocktail.source && cocktail.source.url
        ? '<div class="detail-section"><p class="detail-label">Recipe</p>' +
          '<a class="source-link" href="' + esc(cocktail.source.url) + '" target="_blank" rel="noopener">' +
          esc(cocktail.source.name || "View recipe") + " ↗</a></div>"
        : "") +
      '<div class="detail-section"><p class="detail-label">Rate this</p>' +
      '<p class="phase2-note">Live ratings turn on once the database side of the app is built. For now, this is the menu and the notes.</p>' +
      "</div>" +
      "</div>";
    app.innerHTML = html;
    setActiveTab("tonight");
  }

  function screenStub(title, body) {
    app.innerHTML =
      '<div class="wrap"><span class="screen-kicker">Coming soon</span>' +
      '<h1 class="screen-title">' + esc(title) + "</h1>" +
      '<p class="screen-note">' + body + "</p></div>";
  }

  function setActiveTab(name) {
    document.querySelectorAll(".tab-link").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-tab") === name);
    });
  }

  // ---------- router ----------
  function route() {
    if (state.error) {
      app.innerHTML =
        '<div class="wrap"><div class="empty-state"><h2>Couldn’t load the menu</h2>' +
        "<p>Check the connection and reopen the app — the last downloaded version will still be here once it’s cached.</p></div></div>";
      return;
    }
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);

    if (parts.length === 0 || parts[0] === "tonight") return screenTonight();
    if (parts[0] === "nights") return screenNights();
    if (parts[0] === "night" && parts[1] && parts[2] === "drink" && parts[3]) {
      return screenDrink(decodeURIComponent(parts[1]), decodeURIComponent(parts[3]));
    }
    if (parts[0] === "night" && parts[1]) return goToNight(decodeURIComponent(parts[1]), false);
    if (parts[0] === "library") {
      setActiveTab("library");
      return screenStub("Library", "Every drink ever recorded, searchable and sorted by your own ratings. Arrives with the database in Phase 2.");
    }
    if (parts[0] === "me") {
      setActiveTab("me");
      return screenStub("Me", "Pick your name and see your own ratings across every night. Arrives with the database in Phase 2.");
    }
    // Unknown route: never a blank screen.
    return screenTonight();
  }

  // ---------- boot ----------
  function boot() {
    fetch("./data.json?v=" + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error("bad response");
        return r.json();
      })
      .then(function (data) {
        state.nights = data.nights || [];
        state.updated = data.updated || null;
        updatedLine.textContent = state.updated ? "Menu updated " + formatDate(state.updated) : "";
        route();
      })
      .catch(function () {
        state.error = true;
        route();
      });

    window.addEventListener("hashchange", route);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
  }

  boot();
})();
</script>
</body>
</html>
